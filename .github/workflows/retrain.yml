name: Weekly retrain
on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - run: python backend/jobs/retrain.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}